<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Настройка превью для Telegram/WhatsApp -->
    <meta property="og:title" content="Приглашение на свадьбу Диёра и Миланы">
    <meta property="og:description" content="15 августа 2026 • Мы будем рады видеть вас!">
    <meta property="og:image" content="https://oweeyoyo.github.io/wedding/preview.jpg"> <!-- Замени на свое фото, если оно есть в репозитории -->
    <meta property="og:type" content="website">

    <title>Приглашение на свадьбу</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c9a96e;
            --dark: #0d0b0a;
            --cream: #f5f0e8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--cream);
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            padding: 50px 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--gold);
            margin-top: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.02);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .guest-name {
            font-size: 1.5rem;
            margin: 20px 0;
            font-weight: 200;
            color: var(--gold);
        }

        .date {
            font-size: 1.2rem;
            letter-spacing: 3px;
            margin: 30px 0;
            border-top: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
            padding: 10px 0;
        }

        .music-note {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 50px;
        }

        button {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 15px 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background: var(--gold);
            color: var(--dark);
        }
    </style>
</head>
<body onclick="playMusic()">

    <div class="container">
        <p style="letter-spacing: 5px;">ПРИГЛАШЕНИЕ</p>
        <h1>Диёр & Милана</h1>
        
        <div id="guest-box" class="guest-name">Дорогой гость!</div>
        
        <p>Мы будем счастливы разделить с вами <br> радость этого особенного дня!</p>
        
        <div class="date">15.08.2026</div>
        
        <p>Начало в 18:00</p>
        
        <button onclick="confirmAttendance()">ПОДТВЕРДИТЬ УЧАСТИЕ</button>
        
        <p class="music-note">Нажмите в любом месте, чтобы включить музыку ♫</p>
    </div>

    <!-- Аудио файл из твоего репозитория -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Функция для подстановки имени из ссылки (?guest=Имя)
        const urlParams = new URLSearchParams(window.location.search);
        const guestName = urlParams.get('guest');
        if (guestName) {
            document.getElementById('guest-box').innerText = "Дорогой(ая), " + guestName + "!";
        }

        // Функция запуска музыки
        let musicStarted = false;
        function playMusic() {
            const audio = document.getElementById('bgMusic');
            if (!musicStarted) {
                audio.play().catch(error => console.log("Нужен клик для запуска"));
                musicStarted = true;
            }
        }

        function confirmAttendance() {
            alert('Спасибо! Мы ждем вас!');
        }
    </script>
</body>
</html>
